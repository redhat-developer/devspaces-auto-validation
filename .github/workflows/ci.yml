name: Dev Spaces Auto Validation
on:
  pull_request:
  workflow_dispatch:
    inputs:
      OC_SERVER:
        description: 'OpenShift cluster API URL (defaults to che-dogfooding)'
        type: string
      OC_TOKEN:
        description: 'OpenShift token (defaults to secret)'
        type: string
      OC_PROJECT:
        description: 'OpenShift namespace (defaults to secret)'
        type: string
      EDITOR_DEFINITION_SSH:
        description: 'The (optional) editor definition URL for SSHD.'
        type: string
      EDITOR_DEFINITION_VSCODE:
        description: 'The (optional) editor definition URL for VSCODE.'
        type: string
      EDITOR_DEFINITION_JETBRAINS:
        description: 'The (optional) editor definition URL for JETBRAINS.'
        type: string
      RUN_IMAGE_MATRIX:
        description: 'Run image matrix entries (with custom editor images)'
        type: boolean
        default: true
      PR_NUMBER:
        description: 'PR number to test (che-code or jetbrains-ide-dev-server, runs PR image matrix)'
        type: string

jobs:
  dw-auto-validate:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          # chunk 1: all scenarios
          - scenario: vscode
            image: ''
            mode: main
            chunk: 1
            total_chunks: 4
          - scenario: sshd
            image: ''
            mode: main
            chunk: 1
            total_chunks: 4
          - scenario: jetbrains
            image: ''
            mode: main
            chunk: 1
            total_chunks: 4
          # chunk 2: all scenarios
          - scenario: vscode
            image: ''
            mode: main
            chunk: 2
            total_chunks: 4
          - scenario: sshd
            image: ''
            mode: main
            chunk: 2
            total_chunks: 4
          - scenario: jetbrains
            image: ''
            mode: main
            chunk: 2
            total_chunks: 4
          # chunk 3: all scenarios
          - scenario: vscode
            image: ''
            mode: main
            chunk: 3
            total_chunks: 4
          - scenario: sshd
            image: ''
            mode: main
            chunk: 3
            total_chunks: 4
          - scenario: jetbrains
            image: ''
            mode: main
            chunk: 3
            total_chunks: 4
          # chunk 4: all scenarios
          - scenario: vscode
            image: ''
            mode: main
            chunk: 4
            total_chunks: 4
          - scenario: sshd
            image: ''
            mode: main
            chunk: 4
            total_chunks: 4
          - scenario: jetbrains
            image: ''
            mode: main
            chunk: 4
            total_chunks: 4
          - scenario: vscode
            image: 'quay.io/redhat-user-workloads/devspaces-tenant/devspaces/code-rhel9:latest'
            mode: image
            chunk: 1
            total_chunks: 1
          - scenario: sshd
            image: 'quay.io/redhat-user-workloads/devspaces-tenant/devspaces/code-sshd-rhel9:latest'
            mode: image
            chunk: 1
            total_chunks: 1
          - scenario: jetbrains
            image: 'quay.io/redhat-user-workloads/devspaces-tenant/devspaces/jetbrains-ide-rhel9:latest'
            mode: image
            chunk: 1
            total_chunks: 1
          - scenario: vscode
            image: ''
            mode: pr
            chunk: 1
            total_chunks: 1
          - scenario: sshd
            image: ''
            mode: pr
            chunk: 1
            total_chunks: 1
          - scenario: jetbrains
            image: ''
            mode: pr
            chunk: 1
            total_chunks: 1
    runs-on: ubuntu-latest
    name: dw-auto-validate (${{ matrix.scenario }}, ${{ matrix.mode }}${{ matrix.total_chunks > 1 && format(', chunk {0}/{1}', matrix.chunk, matrix.total_chunks) || '' }})
    steps:
      - name: Check if matrix entry should run
        id: should-run
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            # On PRs, only run main matrix entries
            if [ "${{ matrix.mode }}" == "main" ]; then
              echo "run=true" >> "$GITHUB_OUTPUT"
            else
              echo "run=false" >> "$GITHUB_OUTPUT"
            fi
          elif [ "${{ matrix.mode }}" == "main" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ matrix.mode }}" == "image" ]; then
            if [ "${{ inputs.RUN_IMAGE_MATRIX }}" == "true" ] && [ -z "${{ inputs.PR_NUMBER }}" ]; then
              echo "run=true" >> "$GITHUB_OUTPUT"
            else
              echo "run=false" >> "$GITHUB_OUTPUT"
            fi
          elif [ "${{ matrix.mode }}" == "pr" ]; then
            if [ -n "${{ inputs.PR_NUMBER }}" ]; then
              echo "run=true" >> "$GITHUB_OUTPUT"
            else
              echo "run=false" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Install oc CLI
        if: steps.should-run.outputs.run == 'true'
        uses: redhat-actions/openshift-tools-installer@v3
        with:
          oc: latest
      - name: Checkout Dev Spaces Auto Validation
        if: steps.should-run.outputs.run == 'true'
        uses: actions/checkout@v6
        with:
          repository: 'redhat-developer/devspaces-auto-validation'
      - name: Login to OpenShift
        if: steps.should-run.outputs.run == 'true'
        uses: redhat-actions/oc-login@v2
        with:
          openshift_server_url: ${{ inputs.OC_SERVER || secrets.OC_SERVER }}
          openshift_token: ${{ inputs.OC_TOKEN || secrets.OC_TOKEN }}
          namespace: ${{ inputs.OC_PROJECT || secrets.OC_PROJECT }}
      - name: Run Dev Spaces Auto Validation
        if: steps.should-run.outputs.run == 'true'
        run: |
          if [ "${{ inputs.EDITOR_DEFINITION_SSH }}" != '' ]; then
            sed -i "s|https://.*\.yaml|${{ inputs.EDITOR_DEFINITION_SSH }}|" settings/settings-sshd.env
          fi
          if [ "${{ inputs.EDITOR_DEFINITION_VSCODE }}" != '' ]; then
            sed -i "s|https://.*\.yaml|${{ inputs.EDITOR_DEFINITION_VSCODE }}|" settings/settings-vscode.env
          fi
          if [ "${{ inputs.EDITOR_DEFINITION_JETBRAINS }}" != '' ]; then
            sed -i "s|https://.*\.yaml|${{ inputs.EDITOR_DEFINITION_JETBRAINS }}|" settings/settings-jetbrains.env
          fi
          # Build image list: use full list, then extract this job's chunk
          grep -v '^$' images/images-full.txt > images/images-all.txt
          TOTAL_IMAGES=$(wc -l < images/images-all.txt)
          CHUNK=${{ matrix.chunk }}
          TOTAL_CHUNKS=${{ matrix.total_chunks }}
          CHUNK_SIZE=$(( (TOTAL_IMAGES + TOTAL_CHUNKS - 1) / TOTAL_CHUNKS ))
          START_LINE=$(( (CHUNK - 1) * CHUNK_SIZE + 1 ))
          END_LINE=$(( CHUNK * CHUNK_SIZE ))
          sed -n "${START_LINE},${END_LINE}p" images/images-all.txt > images/images.txt
          echo "Running chunk ${CHUNK}/${TOTAL_CHUNKS}: images ${START_LINE}-${END_LINE} of ${TOTAL_IMAGES}"
          # Append chunk index to DevWorkspace name to avoid collisions between parallel chunks
          if [ "${TOTAL_CHUNKS}" -gt 1 ]; then
            sed -i "s/\(DEVWORKSPACE_NAME='\)\([^']*\)'/\1\2-chunk${CHUNK}'/" settings/settings-${{ matrix.scenario }}.env
          fi
          sed -i '/nodejs/!d' devfiles/devfiles.txt
          EXTRA_ARGS=""
          if [ "${{ matrix.mode }}" == "image" ]; then
            EXTRA_ARGS="-i ${{ matrix.image }}"
          elif [ "${{ matrix.mode }}" == "pr" ]; then
            EXTRA_ARGS="-p ${{ inputs.PR_NUMBER }}"
          fi
          ./dw-auto-validate.sh -v -s ${{ matrix.scenario }} ${EXTRA_ARGS}
